name: Sync agmmnn/awesome-blender
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add agmmnn/awesome-blender
        run: git remote add agmmnn/awesome-blender https://github.com/agmmnn/awesome-blender.git || true
      - name: Fetch agmmnn/awesome-blender
        run: git fetch agmmnn/awesome-blender
      - name: Merge agmmnn/awesome-blender (ours strategy)
        run: |
          git merge agmmnn/awesome-blender/HEAD --no-edit -X ours || git merge FETCH_HEAD --no-edit -X ours || true
          git diff --name-only --diff-filter=U | while IFS= read -r f; do
            case "$f" in
              .github/workflows/sync-agmmnn/awesome-blender.yml) ;;
              .github/workflows/*) git rm -f "$f" ;;
              *) git checkout --ours -- "$f" || true ;;
            esac
          done
      - name: Keep only our workflow
        run: |
          mkdir -p .github/workflows
          find .github/workflows -type f ! -name "sync-agmmnn/awesome-blender.yml" -delete
      - name: Commit and push
        run: |
          git add -f .github/workflows
          git commit -m "chore: preserve fork sync workflow" --allow-empty
          git push